<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nowcast UK – Geography module</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f8faf9; --fg:#1b1f24; --muted:#5d6670; --line:#dfe3e8; --panel:#f5f6f8; --accent:#1b1f24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{margin:0;padding:0;display:flow-root}
  .controls{display:flex;flex-direction:column;gap:8px}
  .content-grid{display:grid;grid-template-columns:8fr 2fr;gap:14px}
  .main-panel{min-width:0}
  .side-panel{border-left:1px solid var(--line);padding-left:14px;font-size:0.85rem;line-height:1.6}
  .side-panel p{margin:0;font-size:0.85rem}
  .sentence{font-size:1rem;font-weight:400;line-height:1.6}
  .inline-select{
    border:0;border-bottom:2px solid var(--fg);background:none;
    font:inherit;font-weight:700;color:var(--fg);cursor:pointer;
  }
  input[type=text]{cursor:text;background-image:none;padding-right:10px;min-width:210px}
  label.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;user-select:none}
  label.chk.off{opacity:.4;cursor:default}
  .chartbox{position:relative;height:550px;margin-top:12px}
  .stats{min-height:20px;font-size:13.5px;color:var(--muted);margin-top:6px}
  .stats b{color:var(--fg)}
  .note{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:18px}
  .note.warn{color:#8a5a00}
  
    @media (max-width:700px){
    .content-grid{grid-template-columns:1fr}
    .side-panel{border-left:none;padding-left:0}
  }
  
  @media (max-width:640px){
    .sentence{font-size:16px}
    .chartbox{height:360px}
    input[type=text]{min-width:0;flex:1}
  }
</style>
</head>
<body>
<div class="wrap">
<div class="content-grid">

<div class="main-panel">
  <div class="controls">
    <div class="sentence">
      Show
      <select id="party" class="inline-select" aria-label="Party"></select>
      <select id="metric" class="inline-select" aria-label="Measure"></select>,
      <select id="period" class="inline-select" aria-label="Election or period"></select>
      against
      <select id="xvar" class="inline-select" aria-label="X axis variable"></select>
    </div>
  </div>

  <div class="chartbox"><canvas id="chart"></canvas></div>
  <div class="stats" id="stats"></div>
  <div class="note" id="note"></div>
</div>

<div class="side-panel">
  <p>Each dot is one English constituency. Choose a party, a measure and a period to set the vertical axis, then pick a local factor to compare it against. The dashed line is the line of best fit, and r summarises how closely the two move together.</p>
</div>

</div>
</div>

/* ============================================================

   ============================================================ */
const $ = id => document.getElementById(id);
const state = {party:'LAB', metric:'share', period:'y2024', xvar:'leave', trend:true, hi:-1};

$('party').innerHTML  = Object.keys(PARTIES).map(k=>`<option value="${k}">${PARTIES[k].name}</option>`).join('');
$('metric').innerHTML = '<option value="share">vote share</option><option value="swing">swing</option>';
$('xvar').innerHTML   = XVARS.map(x=>`<option value="${x.id}">${x.label}</option>`).join('');

const PERIOD_MAP = {  /* keep the nearest equivalent when switching share <-> swing */
  y2019:'19_24', y2024:'19_24', proj:'24_proj',
  '19_24':'y2024', '24_proj':'proj', '19_proj':'proj'
};
function fillPeriods(){
  const opts = PERIODS[state.metric];
  if(!opts.some(o=>o.id===state.period)) state.period = PERIOD_MAP[state.period];
  $('period').innerHTML = opts.map(o=>`<option value="${o.id}">${o.label}</option>`).join('');
  $('period').value = state.period;
}

/* ============================================================
   MATHS
   ============================================================ */
function yValues(){
  const p = PERIODS[state.metric].find(o=>o.id===state.period);
  const A = DATA[p.a][state.party];

  if(state.metric==='share'){
    return A.map((v,i)=>v===0 ? null : v);
  }

  const B = DATA[p.b][state.party];
  return A.map((v,i)=>{
    if(v===0 || B[i]===0) return null;
    return +(v-B[i]).toFixed(3);
  });
}
function pearson(xs,ys){
  const n=xs.length; let sx=0,sy=0;
  for(let i=0;i<n;i++){sx+=xs[i];sy+=ys[i];}
  const mx=sx/n,my=sy/n; let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy;}
  const r=sxy/Math.sqrt(sxx*syy);
  return {r, slope:sxy/sxx, mx, my};
}

    c.save(); c.font='600 13px system-ui,sans-serif';
    const w = c.measureText(txt).width+12, h=22;
    let x = pt.x+10, y = pt.y-h-6;
    if(x+w>a.right) x = pt.x-10-w;
    if(y<a.top) y = pt.y+10;
    c.fillStyle='#1b1f24'; c.beginPath(); c.roundRect(x,y,w,h,5); c.fill();
    c.fillStyle='#fff'; c.textBaseline='middle'; c.fillText(txt,x+6,y+h/2+.5);
    c.restore();
  }
};

const chart = new Chart($('chart'),{
  type:'scatter',
  data:{datasets:[
    {label:'Constituencies', data:[], pointRadius:3.6, pointHoverRadius:6, pointHitRadius:6, borderWidth:.6, order:2},
    {label:'Line of best fit', data:[], type:'line', showLine:true, pointRadius:0, borderColor:'#1b1f24', borderWidth:2, borderDash:[7,5], fill:false, tension:0, order:1, pointHitRadius:0, pointHoverRadius:0},
    {label:'Highlighted', data:[], pointRadius:8, pointBorderWidth:2.5, pointBorderColor:'#1b1f24', pointBackgroundColor:'transparent', pointHoverRadius:8, order:0}
  ]},
  options:{
    maintainAspectRatio:false,
    devicePixelRatio: Math.max(window.devicePixelRatio || 1, 2),
    animation:{duration:450},
    interaction:{mode:'nearest', intersect:true},
    plugins:{
      legend:{display:false},
      tooltip:{
        filter:item=>item.datasetIndex!==1,
        displayColors:false,
        padding:10,
        titleFont:{size:14,weight:'700'},
        callbacks:{
          title:items=>NAMES[items[0].raw.i],
          label:item=>{
            const xv=XVARS.find(x=>x.id===state.xvar);
            return [yAxisShort()+': '+fmtY(item.raw.y), xv.label.replace(/ \(.*\)/,'')+': '+xv.fmt(item.raw.x)];
          }
        }
      }
    },
    scales:{
      x:{type:'linear', title:{display:true,font:{weight:'600'}}, grid:{color:'#eceff2'}, ticks:{maxTicksLimit:9}},
      y:{title:{display:true,font:{weight:'600'}},
         grid:{color:ctx=>ctx.tick && ctx.tick.value===0 ? '#6b7480' : '#eceff2',
               lineWidth:ctx=>ctx.tick && ctx.tick.value===0 ? 1.6 : 1}}
    }
  },
  plugins:[hiPlugin]
});

function fmtY(v){
  if(state.metric==='swing') return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1)+' pp';
  return v.toFixed(1)+'%';
}
function periodLabel(){ return PERIODS[state.metric].find(o=>o.id===state.period).label; }
function yAxisShort(){
  return state.party+(state.metric==='share' ? ' vote share, ' : ' swing, ')+periodLabel().toLowerCase().replace('projected','projected');
}
function yAxisTitle(){
  return state.metric==='share'
    ? `${PARTIES[state.party].name} vote share, ${periodLabel()==='Projected'?'projected':periodLabel()} (%)`
    : `${PARTIES[state.party].name} swing, ${periodLabel()} (percentage points)`;
}

  function sizeSelects(){
  ['party','metric','period','xvar'].forEach(id=>{
    const el = $(id);
    const span = document.createElement('span');
    const cs = getComputedStyle(el);
    span.style.font = cs.font;
    span.style.fontWeight = cs.fontWeight;
    span.style.position = 'absolute';
    span.style.visibility = 'hidden';
    span.style.whiteSpace = 'pre';
    span.textContent = el.options[el.selectedIndex].text;
    document.body.appendChild(span);
    el.style.width = (span.offsetWidth + 24) + 'px';
    document.body.removeChild(span);
  });
}

function update(){
  const xv = XVARS.find(x=>x.id===state.xvar);
  const useLog = xv.id === 'area';
const rawXs = DATA.x[xv.id], rawYs = yValues(), col = PARTIES[state.party].colour;

/* points — exclude constituencies where the party has no valid vote-share data */
const pts = rawXs
  .map((x,i)=>({x, y:rawYs[i], i}))
  .filter(p=>p.y!==null);
const xs = pts.map(p=>p.x);
const ys = pts.map(p=>p.y);
  const ds0 = chart.data.datasets[0];
  ds0.data = pts; ds0.backgroundColor = col+'99'; ds0.borderColor = col; ds0.hoverBackgroundColor = col;

  /* axes: titles, formatting, scale type */
  const sx = chart.options.scales.x, sy = chart.options.scales.y;
  sx.type = useLog ? 'logarithmic' : 'linear';
  sx.title.text = xv.axis + (useLog ? ' – log scale' : '');
  sx.ticks.callback = v => {
    if(useLog){ const l=Math.log10(v); if(Math.abs(l-Math.round(l))>1e-9 && ![2,5,20,50,200,500,2000].includes(v)) return ''; }
    return xv.tick(v);
  };
  sx.min = undefined; sx.max = undefined;
  if(xv.id==='lat'){ sx.min=50; sx.max=56; }
  sy.title.text = yAxisTitle();
  sy.ticks.callback = v => state.metric==='swing' ? (v>0?'+':v<0?'−':'')+Math.abs(v) : v+'%';
  sy.beginAtZero = state.metric==='share';
  sy.min = state.metric==='share' ? 0 : undefined;

  /* line of best fit (fitted on log10(x) when log scale is on) */
  const tr = chart.data.datasets[1];
  let statsHtml = '';
  if(state.trend){
    const tx = useLog ? xs.map(Math.log10) : xs;
    const f = pearson(tx, ys);
    const lo = Math.min(...xs), hi = Math.max(...xs), N = useLog ? 60 : 2, line = [];
    for(let k=0;k<N;k++){
      const x = useLog ? Math.pow(10, Math.log10(lo)+(Math.log10(hi)-Math.log10(lo))*k/(N-1)) : (k?hi:lo);
      const t = useLog ? Math.log10(x) : x;
      line.push({x, y:f.my + f.slope*(t-f.mx)});
    }
    tr.data = line;
    const r = f.r, strength = Math.abs(r)<.2?'very weak':Math.abs(r)<.4?'weak':Math.abs(r)<.6?'moderate':Math.abs(r)<.8?'strong':'very strong';
const correlationLabel =
  Math.abs(r) <= 0.10
    ? 'virtually no correlation'
    : `${strength} ${r>=0?'positive':'negative'}`;

statsHtml = `Correlation <b>r = ${r.toFixed(2).replace('-','−')}</b> (R² = ${(r*r).toFixed(2)}) across ${xs.length} English constituencies – ${correlationLabel}${useLog?' (on log scale)':''}.`;
  } else { tr.data = []; statsHtml = `${xs.length} English constituencies.`; }
  $('stats').innerHTML = statsHtml;

  /* highlight */
const hs = chart.data.datasets[2];
hs.data = state.hi>=0 ? [pts.find(p=>p.i===state.hi)] : [];

  /* notes */
  let note='', warn=false;
  const p = PERIODS[state.metric].find(o=>o.id===state.period);
if(state.metric==='swing'){
  note = 'Swing = change in vote share between the two dates, in percentage points.';
}
  $('note').textContent = note; $('note').className = 'note'+(warn?' warn':'');

  chart.update();
  sizeSelects();
  $('party').style.borderBottomColor = col;
  postHeight();
}

/* ============================================================
   EVENTS
   ============================================================ */
$('party').onchange  = e=>{state.party=e.target.value; update();};
$('metric').onchange = e=>{state.metric=e.target.value; fillPeriods(); update();};
$('period').onchange = e=>{state.period=e.target.value; update();};
$('xvar').onchange   = e=>{state.xvar=e.target.value; update();};

/* ============================================================
   IFRAME HEIGHT  →  parent page
   (match the message shape used by your other modules)
   ============================================================ */
function postHeight(){
  var h = Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height);
  try{ window.parent.postMessage({ sender: 'nowcast-module', height: h }, '*'); }catch(e){}
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
if('ResizeObserver' in window) new ResizeObserver(postHeight).observe(document.querySelector('.wrap'));

fillPeriods();
update();
</script>
</body>
