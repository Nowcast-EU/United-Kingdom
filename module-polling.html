<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nowcast UK: GB polling averages</title>
<style>
  :root {
    --nc-page: #f3f4f6;
    --nc-bg: #f8faf9;
    --nc-fg: #1a1d23;
    --nc-muted: #5e6673;
    --nc-grid: #e7e9ed;
    --nc-border: #d9dde3;
    --nc-hover: #f0f2f5;
    --nc-focus: #2358d6;
  }

  * { box-sizing: border-box; }

  /* Page chrome for standalone preview only. When embedding, drop these body rules
     and the module will inherit your site's font. */
  body {
    margin: 0;
    padding: 0;
    background: var(--nc-bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---------- Module ---------- */
  .nc-module {
    max-width: none;
    margin: 0;
    padding: 0;
    background: none;
    color: var(--nc-fg);
    font-family: inherit;
    line-height: 1.4;
  }

  /* Party readout: doubles as the legend and as show/hide buttons */
  .nc-readout-label { min-height: 1.3em; margin-bottom: 10px; color: #000000; font-size: 0.85rem; }
  .nc-keys {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
    gap: 4px 10px;
    margin: 0 0 12px;
    padding: 0;
    list-style: none;
  }
  .nc-key {
    display: block;
    width: 100%;
    padding: 6px 4px 6px 0;
    text-align: left;
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    border-top: 3px solid var(--c);
    cursor: pointer;
  }
  .nc-key:hover { background: var(--nc-hover); }
  .nc-key.is-off { opacity: 0.4; }
  .nc-name { display: block; color: var(--nc-muted); font-size: 0.82rem; }
  .nc-val { display: block; font-size: 1.6rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .nc-chg { display: block; color: var(--nc-muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }

  /* Controls */
  .nc-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 16px; margin-bottom: 8px; font-size: 0.85rem; }
  .nc-controls label.is-disabled { opacity: 0.4; }
  .nc-view-toggle { display: inline-flex; gap: 14px; }
  .nc-view-btn {
    padding: 2px 0;
    font: inherit;
    color: var(--nc-muted);
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .nc-view-btn:hover { color: var(--nc-fg); }
  .nc-view-btn[aria-pressed="true"] { color: var(--nc-fg); border-bottom-color: var(--nc-fg); }
  .nc-divider { width: 1px; height: 16px; background: var(--nc-border); }
  .nc-controls label { display: inline-flex; align-items: center; gap: 6px; color: var(--nc-muted); }
  .nc-controls select {
    padding: 3px 6px;
    font: inherit;
    color: var(--nc-fg);
    background: var(--nc-bg);
    border: 1px solid var(--nc-border);
    border-radius: 4px;
  }
  .nc-module button:focus-visible,
  .nc-module select:focus-visible,
  .nc-module input:focus-visible { outline: 2px solid var(--nc-focus); outline-offset: 2px; }

  /* Chart */
  .nc-chart { position: relative; aspect-ratio: 7 / 3; }
  .nc-chart canvas { touch-action: pan-y; }
  .nc-error { padding: 16px; border: 1px solid var(--nc-border); border-radius: 6px; color: var(--nc-fg); }

  @media (max-width: 600px) {
    .nc-chart { aspect-ratio: 5 / 3; }
  }

   .nc-extra {
    display: grid;
    grid-template-columns: 1fr 1px 1.6fr;
    gap: 24px;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--nc-border);
  }
  .nc-extra h3 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 700; }
  .nc-notes p { margin: 0 0 10px; color: var(--nc-fg); font-size: 0.9rem; line-height: 1.5; }
  .nc-divider-v { background: var(--nc-border); }

  .nc-leader-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap: 16px 12px;
  }
  .nc-leader { text-align: center; }
  .nc-leader-photo {
    width: 72px; height: 72px;
    margin: 0 auto 8px;
    border-radius: 50%;
    background: var(--nc-hover);
    border: 1px solid var(--nc-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; font-weight: 700; color: var(--nc-muted);
    overflow: hidden;
  }
  .nc-leader-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .nc-leader-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }

  .nc-leader-bar {
    position: relative;
    height: 8px;
    background: var(--nc-grid);   /* this shows through as the "don't know" colour, unfilled */
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .nc-bar-disapprove, .nc-bar-approve { position: absolute; top: 0; bottom: 0; }
  .nc-bar-disapprove { right: 50%; background: #bb0000; }
  .nc-bar-approve    { left: 50%;  background: #008500; }
  .nc-bar-mid {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 1px;
    background: var(--nc-fg); opacity: 0.4;
  }
  .nc-leader-net { font-size: 0.95rem; font-weight: 700; }

  @media (max-width: 700px) {
    .nc-extra { grid-template-columns: 1fr; }
    .nc-divider-v { display: none; }
  }
  
</style>
</head>

<section class="nc-module" id="nc-polling" aria-label="GB voting intention polling average">

  <div class="nc-readout-label" id="nc-readout-label" aria-live="off"></div>
  <div class="nc-keys" id="nc-keys"></div>

<div class="nc-controls">

      <span class="nc-divider" aria-hidden="true"></span>
    <button type="button" class="nc-view-btn" data-view="polling" aria-pressed="true">Polling average</button>
  </div>
  <label id="nc-show-polls-label"><input type="checkbox" id="nc-show-polls" checked> Show individual polls</label>
  <label id="nc-show-margin-label"><input type="checkbox" id="nc-show-margin" checked> Show margin of uncertainty</label>
</div>

  <div class="nc-chart" id="nc-chart">
    <canvas id="nc-canvas" role="img" aria-label="Line chart of GB voting intention polling averages"></canvas>
  </div>

 <div class="nc-extra">
  <div class="nc-notes">
    <h3>Note on Scotland &amp; Wales</h3>
    <div id="nc-notes-body">

    </div>

  <div class="nc-divider-v" aria-hidden="true"></div>
  <div class="nc-leaders">
    <h3>Leadership Net Approval</h3>
    <div class="nc-leader-grid" id="nc-leader-grid"></div>
  </div>
</div> 

</section>

    const clean = c => c.trim().replace(/^"|"$/g, '').trim();
    const header = lines[0].split(delim).map(c => clean(c).toLowerCase());

    const nameCol = header.indexOf('name');
    const appCol = header.findIndex(h => ['approve', 'approval'].indexOf(h) !== -1);
    const disCol = header.findIndex(h => ['disapprove', 'disapproval'].indexOf(h) !== -1);
    const dkCol = header.findIndex(h => ["don't know", 'dont know', 'dk', 'unsure'].indexOf(h) !== -1);

  /* Daily rolling average. For each day, looks back `windowDays` and averages the polls
     inside that window (optionally only the latest poll per pollster).
     Returns { days: [ms...], series: { partyKey: [value | null ...] } } */
function computeAverages(polls, parties, opts) {
  const sigma = opts.kernelSigma;
  const twoSigmaSq = 2 * sigma * sigma;

  const first = polls[0].t;
  const last = polls[polls.length - 1].t;

  const days = [];

  for (let d = first; d <= last; d += DAY) {
    days.push(d);
  }

  const series = {};
  const uncertainty = {};

  parties.forEach(p => {
    series[p.key] = new Array(days.length).fill(null);
    uncertainty[p.key] = new Array(days.length).fill(null);

    days.forEach((day, i) => {

      const observations = [];

      polls.forEach(poll => {
        const value = poll.v[p.key];

        if (value == null) return;
        if (!poll.sampleSize || poll.sampleSize <= 0) return;

        const daysDiff = (poll.t - day) / DAY;

        const gaussian = Math.exp(
          -(daysDiff * daysDiff) / twoSigmaSq
        );

        const weight = gaussian * poll.sampleSize;

        observations.push({
          value,
          sampleSize: poll.sampleSize,
          gaussian,
          weight
        });
      });

      if (observations.length === 0) return;

      // --------------------------------
      // 1. Calculate the smoothed average
      // --------------------------------

      let weightedSum = 0;
      let totalWeight = 0;

      observations.forEach(o => {
        weightedSum += o.value * o.weight;
        totalWeight += o.weight;
      });

      const average = weightedSum / totalWeight;

      series[p.key][i] = average;


      // --------------------------------
      // 2. Effective sample size
      // --------------------------------

      let sumW = 0;
      let sumW2OverN = 0;

      observations.forEach(o => {
        sumW += o.weight;
        sumW2OverN +=
          (o.weight * o.weight) / o.sampleSize;
      });

      const effectiveSample =
        sumW2OverN > 0
          ? (sumW * sumW) / sumW2OverN
          : 0;


      // --------------------------------
      // 3. Effective number of polls
      // --------------------------------

      let sumG = 0;
      let sumG2 = 0;

      observations.forEach(o => {
        sumG += o.gaussian;
        sumG2 += o.gaussian * o.gaussian;
      });

      const effectivePolls =
        sumG2 > 0
          ? (sumG * sumG) / sumG2
          : 0;


      // --------------------------------
      // 4. How much the polls disagree
      // --------------------------------

      let varianceNumerator = 0;

      observations.forEach(o => {
        varianceNumerator +=
          o.weight *
          Math.pow(o.value - average, 2);
      });

      const pollVariance =
        totalWeight > 0
          ? varianceNumerator / totalWeight
          : 0;

      const pollSD = Math.sqrt(pollVariance);


      // --------------------------------
      // 5. Uncertainty from poll disagreement
      // --------------------------------

      const pollSE =
        effectivePolls > 1
          ? pollSD / Math.sqrt(effectivePolls)
          : 0;


      // --------------------------------
      // 6. Sampling uncertainty
      // --------------------------------

      const pShare = average / 100;

      const samplingVariance =
        effectiveSample > 0
          ? (pShare * (1 - pShare) / effectiveSample) * 10000
          : 0;


      // --------------------------------
      // 7. Combine the uncertainties
      // --------------------------------

      const totalVariance =
        Math.pow(pollSE, 2) +
        samplingVariance;

      const totalSE = Math.sqrt(totalVariance);


      // --------------------------------
      // 8. 95% uncertainty interval
      // --------------------------------

      const margin = 1.96 * totalSE * opts.bandScale;

      const upper =
        Math.min(100, average + margin);

      const lower =
        Math.max(0, average - margin);


      uncertainty[p.key][i] = {
        upper,
        lower,
        se: totalSE,
        effectiveSample,
        effectivePolls
      };

    });
  });

  return {
    days,
    series,
    uncertainty
  };
}

          if (!state.visible[p.key] || resultVal == null) return;
          const cy = y.getPixelForValue(resultVal);
          const r = c.width <= 600 ? 4 : 6;
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(gx, cy - r);
          ctx.lineTo(gx + r, cy);
          ctx.lineTo(gx, cy + r);
          ctx.lineTo(gx - r, cy);
          ctx.closePath();
          ctx.fillStyle = p.colour;
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#f8faf9';
          ctx.stroke();
          ctx.restore();
        });
      }

      if (state.view === 'seats') {
        if (state.hoverSeatIdx == null || !seatRows.length) return;
        const row = seatRows[state.hoverSeatIdx];
        const px = x.getPixelForValue(row.t);
        if (px < a.left || px > a.right) return;
        ctx.save();
        ctx.strokeStyle = T.muted;
        ctx.globalAlpha = 0.6;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke();
        ctx.globalAlpha = 1;
        const hoverR = c.width <= 600 ? 3 : 4.5;
        ACTIVE.forEach(p => {
          if (!state.visible[p.key]) return;
          const v = row.v[p.key];
          if (v == null) return;
          ctx.beginPath();
          ctx.arc(px, y.getPixelForValue(v), hoverR, 0, Math.PI * 2);
          ctx.fillStyle = p.colour;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = T.bg;
          ctx.stroke();
        });
        ctx.restore();
        return;
      }

      if (state.hoverIdx == null) return;
      const px = x.getPixelForValue(avg.days[state.hoverIdx]);
      if (px < a.left || px > a.right) return;
      ctx.save();
      ctx.strokeStyle = T.muted;
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke();
      ctx.globalAlpha = 1;
      const hoverR = c.width <= 600 ? 3 : 4.5;
      ACTIVE.forEach(p => {
        if (!state.visible[p.key]) return;
        const v = avg.series[p.key][state.hoverIdx];
        if (v == null) return;
        ctx.beginPath();
        ctx.arc(px, y.getPixelForValue(v), hoverR, 0, Math.PI * 2);
        ctx.fillStyle = p.colour;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = T.bg;
        ctx.stroke();
      });
      ctx.restore();
    }
  };

  const datasets = [
    // 0..n-1: rolling averages (drawn on top)
    ...ACTIVE.map(p => ({
      type: 'line', label: p.label, data: [], parsing: false, normalized: true,
      borderColor: p.colour, backgroundColor: p.colour, borderWidth: 2.5,
      pointRadius: 0, pointHoverRadius: 0, tension: 0.2, spanGaps: true, order: 1
    })),

    // n..2n-1: upper margin-of-error boundaries
...ACTIVE.map(p => ({
  type: 'line',
  label: p.label + ' (uncertainty upper)',
  data: [],
  parsing: false,
  normalized: true,
  borderColor: 'transparent',
  backgroundColor: rgba(p.colour, 0.12),
  borderWidth: 0,
  pointRadius: 0,
  pointHoverRadius: 0,
  tension: 0.2,
  spanGaps: true,
  fill: false,
  order: 3
})),

// 2n..3n-1: lower margin-of-error boundaries
...ACTIVE.map((p, i) => ({
  type: 'line',
  label: p.label + ' (uncertainty lower)',
  data: [],
  parsing: false,
  normalized: true,
  borderColor: 'transparent',
  backgroundColor: rgba(p.colour, 0.12),
  borderWidth: 0,
  pointRadius: 0,
  pointHoverRadius: 0,
  tension: 0.2,
  spanGaps: true,
  fill: { target: n + i },
  order: 3
})),
    
    // 3n..4n-1: individual polls (faint dots underneath)
    ...ACTIVE.map(p => ({
      type: 'scatter', label: p.label + ' (polls)', parsing: false, normalized: true,
      data: polls.filter(o => o.v[p.key] != null).map(o => ({ x: o.t, y: o.v[p.key] })),
      backgroundColor: rgba(p.colour, 0.12), borderColor: 'transparent',
      pointRadius: ctx => ctx.chart.width <= 600 ? 1.3 : 2.3,
      pointHoverRadius: ctx => ctx.chart.width <= 600 ? 1.3 : 2.3,
      order: 2
    })),

    // 4n..5n-1: seat projections — straight lines between actual projection dates, no smoothing
    ...ACTIVE.map(p => ({
      type: 'line', label: p.label + ' (seats)', data: [], parsing: false, normalized: true, hidden: true,
      borderColor: p.colour, backgroundColor: p.colour,
      borderWidth: ctx => ctx.chart.width <= 600 ? 1.25 : 2.5,
      pointRadius: ctx => ctx.chart.width <= 600 ? 1.25 : 2,
      pointHoverRadius: ctx => ctx.chart.width <= 600 ? 1 : 2,
      tension: 0, spanGaps: true, order: 1
    }))
  ];

  const canvas = $('nc-canvas');
  const chart = new Chart(canvas, {
    type: 'line',
    data: { datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 250 },
      events: [],                                   // hover is handled below, not by Chart.js
      layout: { padding: { top: 18, right: 0 } },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: {
          type: 'linear', min: avg.days[0], max: avg.days[avg.days.length - 1],
          grid: { color: T.grid, drawTicks: false },
          border: { color: T.grid },
          ticks: { color: T.muted, maxRotation: 0, autoSkip: false, padding: 8, callback: v => fmtMonthShort(v) },
          afterBuildTicks: buildMonthTicks
        },
        y: {
          min: 0, max: 40,
          grid: { color: T.grid },
          border: { display: false },
          ticks: {
            color: T.muted, stepSize: 5, padding: 8,
            font: ctx => ({ size: ctx.chart.width <= 600 ? 11 : 13 }),
            callback: v => v + '%'
          },
          afterFit: scale => {
            const trim = scale.chart.width <= 600 ? 4 : 2;
            scale.width = Math.max(24, scale.width - trim);
          }
        }
      }
    },
    plugins: [overlay]
  });

  /* ==========================================================================
     7. UPDATE FUNCTIONS
     ========================================================================== */
  function applyRange() {
    const b = rangeBounds();
    chart.options.scales.x.min = b.min;
    chart.options.scales.x.max = b.max;
    fitY(b.min, b.max);
    chart.update();
  }

function applyVisibility(instant) {
  const seats = state.view === 'seats';
  ACTIVE.forEach((p, i) => {
    const on = state.visible[p.key];
    chart.setDatasetVisibility(i, on && !seats);                              // average line
    chart.setDatasetVisibility(n + i, on && !seats && state.showMargin);      // upper band
    chart.setDatasetVisibility(2 * n + i, on && !seats && state.showMargin);  // lower band
    chart.setDatasetVisibility(3 * n + i, on && !seats && state.showPolls);   // poll dots
    chart.setDatasetVisibility(4 * n + i, on && seats);                       // seat line
  });
  if (seats) {
    fitYSeats();
  } else {
    const b = rangeBounds();
    fitY(b.min, b.max);
  }
  chart.update(instant ? 'none' : undefined);
}

  function renderReadout() {
    if (state.view === 'seats') {
      if (!seatRows.length) {
        $('nc-readout-label').textContent = 'No seat projection data yet.';
        ACTIVE.forEach(p => { keyEls[p.key].val.textContent = '–'; keyEls[p.key].chg.textContent = '\u00a0'; });
        return;
      }
      const idx = state.hoverSeatIdx == null ? seatRows.length - 1 : state.hoverSeatIdx;
      $('nc-readout-label').innerHTML =
        (state.hoverSeatIdx == null ? 'Latest projection, ' : 'Projection for ') +
        '<strong>' + fmtDate(seatRows[idx].t) + '</strong>' +
        ' • Changes compared to the 2024 general election in Great Britain.';
      ACTIVE.forEach(p => {
        const cur = seatRows[idx].v[p.key];
        keyEls[p.key].val.textContent = cur == null ? '–' : Math.round(cur);
        let chg = '';
        if (cur != null && p.seatResult != null) {
          const d = Math.round(cur) - p.seatResult;
          if (d === 0) {
            chg = '– 0';
          } else {
            const up = d > 0;
            const colour = up ? '#008500' : '#bb0000';
            chg = '<span style="color:' + colour + '">' + (up ? '▲' : '▼') + '</span> ' + Math.abs(d);
          }
        }
        keyEls[p.key].chg.innerHTML = chg || '\u00a0';
      });
      return;
    }

    const idx = state.hoverIdx == null ? avg.days.length - 1 : state.hoverIdx;
    $('nc-readout-label').innerHTML =
      (state.hoverIdx == null ? 'Latest polling, ' : 'Polling averages on ') +
      '<strong>' + fmtDate(avg.days[idx]) + '</strong>' +
      ' • Changes compared to the 2024 general election in Great Britain.';
    ACTIVE.forEach(p => {
      const cur = avg.series[p.key][idx];
      keyEls[p.key].val.textContent = cur == null ? '–' : cur.toFixed(1) + '%';
      let chg = '';
      if (cur != null && p.result != null) {
        const d = cur - p.result;
        if (Math.abs(d) < 0.05) {
          chg = '– 0.0';
        } else {
          const up = d > 0;
          const colour = up ? '#008500' : '#bb0000';
          chg = '<span style="color:' + colour + '">' + (up ? '▲' : '▼') + '</span> ' + Math.abs(d).toFixed(1);
        }
      }
      keyEls[p.key].chg.innerHTML = chg || '\u00a0';
    });
  }

  function renderText() {
    if (state.view === 'seats') {
      if (!seatRows.length) {
        canvas.setAttribute('aria-label', 'Seat projection chart: no data yet.');
        return;
      }
      const last = seatRows.length - 1;
      canvas.setAttribute('aria-label', 'Line chart of Nowcast UK seat projections. Latest: ' +
        ACTIVE.map(p => {
          const v = seatRows[last].v[p.key];
          return p.label + ' ' + (v == null ? 'no data' : Math.round(v) + ' seats');
        }).join(', ') + '.');
      return;
    }

    const last = avg.days.length - 1;
    canvas.setAttribute('aria-label', 'Line chart of GB voting intention polling averages. Latest: ' +
      ACTIVE.map(p => {
        const v = avg.series[p.key][last];
        return p.label + ' ' + (v == null ? 'no data' : v.toFixed(1) + '%');
      }).join(', ') + '.');
  }

function refresh() {
  avg = computeAverages(polls, ACTIVE, CONFIG);

  ACTIVE.forEach((p, i) => {
    const values = avg.series[p.key];

    // Average line
    chart.data.datasets[i].data = toXY(avg.days, values);

// Upper uncertainty boundary
chart.data.datasets[n + i].data = toXY(
  avg.days,
  avg.uncertainty[p.key].map(u => u == null ? null : u.upper)
);

// Lower uncertainty boundary
chart.data.datasets[2 * n + i].data = toXY(
  avg.days,
  avg.uncertainty[p.key].map(u => u == null ? null : u.lower)
);
  });

      ACTIVE.forEach((p, i) => {
      chart.data.datasets[4 * n + i].data = seatRows
        .filter(o => o.v[p.key] != null)
        .map(o => ({ x: o.t, y: o.v[p.key] }));
    });

state.hoverIdx = null;
applyRange();
applyVisibility();
renderReadout();
renderText();
}

  /* ==========================================================================
     8. HOVER / TOUCH SCRUBBING
     ========================================================================== */
  function clearHover() {
    if (state.view === 'seats') {
      if (state.hoverSeatIdx == null) return;
      state.hoverSeatIdx = null;
    } else {
      if (state.hoverIdx == null) return;
      state.hoverIdx = null;
    }
    renderReadout();
    chart.draw();
  }
  function updateHoverFromPixel(px) {
    const a = chart.chartArea;
    if (px < a.left || px > a.right) { clearHover(); return; }
    const t = chart.scales.x.getValueForPixel(px);

    if (state.view === 'seats') {
      if (!seatRows.length) return;
      let best = 0, bestDist = Infinity;
      seatRows.forEach((row, k) => {
        const d = Math.abs(row.t - t);
        if (d < bestDist) { bestDist = d; best = k; }
      });
      if (best !== state.hoverSeatIdx) {
        state.hoverSeatIdx = best;
        renderReadout();
        chart.draw();
      }
      return;
    }

    let i = Math.round((t - avg.days[0]) / DAY);
    i = Math.max(0, Math.min(avg.days.length - 1, i));
    if (i !== state.hoverIdx) {
      state.hoverIdx = i;
      renderReadout();
      chart.draw();
    }
  }

  canvas.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect();
    updateHoverFromPixel(e.clientX - r.left);
  });

  // Touch: a tap sets the highlighter immediately, rather than waiting for a drag
  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;   // mouse/pen already handled by pointermove
    const r = canvas.getBoundingClientRect();
    updateHoverFromPixel(e.clientX - r.left);
  });

  // Mouse/pen still clear on leaving the chart; touch is left alone here (see below)
  canvas.addEventListener('pointerleave', e => {
    if (e.pointerType === 'touch') return;
    clearHover();
  });
  canvas.addEventListener('pointercancel', e => {
    if (e.pointerType === 'touch') return;
    clearHover();
  });

  // Touch: clear only when the person taps outside the chart entirely
  document.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    if (canvas.contains(e.target)) return;   // taps on the canvas are handled above
    clearHover();
  });

  /* Follow light/dark changes */
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onScheme = () => requestAnimationFrame(() => {
    T = readTheme();
    const s = chart.options.scales;
    s.x.grid.color = T.grid; s.x.border.color = T.grid; s.x.ticks.color = T.muted;
    s.y.grid.color = T.grid; s.y.ticks.color = T.muted;
    chart.update('none');
  });
  if (mq.addEventListener) mq.addEventListener('change', onScheme);

    function renderLeaders() {
    const grid = $('nc-leader-grid');
    if (!grid) return;
    const leaders = parseLeaders(RAW_LEADERS);
    if (!leaders.length) {
      grid.innerHTML = '<p style="color:var(--nc-muted);font-size:0.85rem;">No approval data yet — paste your table into RAW_LEADERS.</p>';
      return;
    }
    grid.innerHTML = leaders.map(l => {
      const net = l.approve - l.disapprove;
      const netTxt = (net >= 0 ? '+' : '') + net.toFixed(1);
      const netColour = net > 0 ? '#008500' : (net < 0 ? '#bb0000' : 'var(--nc-muted)');
      const initials = l.name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const photoHtml = l.photo
        ? '<img src="' + l.photo.replace(/"/g, '&quot;') + '" alt="">'
        : initials;
      return '' +
        '<div class="nc-leader">' +
          '<div class="nc-leader-photo">' + photoHtml + '</div>' +
          '<div class="nc-leader-name">' + l.name + '</div>' +
          '<div class="nc-leader-bar">' +
            '<div class="nc-bar-disapprove" style="width:' + (l.disapprove / 2) + '%"></div>' +
            '<div class="nc-bar-approve" style="width:' + (l.approve / 2) + '%"></div>' +
            '<div class="nc-bar-mid"></div>' +
          '</div>' +
          '<div class="nc-leader-net" style="color:' + netColour + '">' + netTxt + '</div>' +
        '</div>';
    }).join('');
  }

  renderLeaders();

  /* ==========================================================================
     9. GO
     ========================================================================== */
  refresh();

  // Handy for iterating from the browser console
  window.NowcastPolling = { chart: chart, polls: polls, config: CONFIG, refresh: refresh };

    // Report height to the parent page (matches the listener in the main site)
  if (window.parent !== window) {
    const postHeight = () => window.parent.postMessage(
      { sender: 'nowcast-module', height: Math.ceil(root.getBoundingClientRect().height) }, '*');
    new ResizeObserver(postHeight).observe(root);
    postHeight();
  }
  
})();
</script>
</body>
</html>
