<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greater Manchester wards – data visualiser</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f8faf9; --fg:#1b1f24; --muted:#5d6670; --line:#dfe3e8; --panel:#f5f6f8; --accent:#1b1f24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{margin:0;padding:0;display:flow-root}
  .controls{display:flex;flex-direction:column;gap:8px}
  .content-grid{display:grid;grid-template-columns:1fr;gap:14px}
  .main-panel{min-width:0}
  .source{font-size:12.5px;font-style:italic;color:#999999;margin-top:4px}
  .source a{color:inherit;text-decoration:underline}
  .source a:hover{color:#666666}
  .sentence{font-size:1rem;font-weight:400;line-height:1.6}
  .inline-select{
    border:0;border-bottom:2px solid var(--fg);background:none;
    font:inherit;font-weight:700;color:var(--fg);cursor:pointer;
  }
  input[type=text]{cursor:text;background-image:none;padding-right:10px;min-width:210px}
  label.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;user-select:none}
  label.chk.off{opacity:.4;cursor:default}
  .chartbox{position:relative;height:750px;margin-top:12px}
  .stats{min-height:20px;font-size:13.5px;color:var(--muted);margin-top:6px}
  .stats b{color:var(--fg)}
  .note{font-size:12.5px;color:var(--muted);margin-top:4px}
  .note:empty{display:none}
  .note.warn{color:#8a5a00}

    .dd{position:relative;display:inline-block}
  .dd-btn{
    position:relative;border:0;border-bottom:2px solid var(--fg);border-radius:0;background:none;
    -webkit-appearance:none;appearance:none;
    font:inherit;font-weight:700;color:var(--fg);line-height:inherit;
    padding:0 24px 0 2px;margin:0;text-align:left;cursor:pointer;
  }
  .dd-btn::after{
    content:'';position:absolute;right:6px;top:50%;width:6px;height:6px;
    border-right:2px solid currentColor;border-bottom:2px solid currentColor;
    transform:translateY(-70%) rotate(45deg);
  }
  .dd.open .dd-btn::after{transform:translateY(-30%) rotate(-135deg)}

  .dd-menu{
    display:none;position:absolute;left:0;top:100%;margin-top:4px;z-index:50;
    min-width:100%;max-height:300px;overflow-y:auto;padding:4px 0;
    background:var(--bg);border:1px solid var(--fg);border-radius:2px;
    box-shadow:0 4px 14px rgba(0,0,0,.12);
    font-size:.9em;font-weight:400;white-space:nowrap;
  }
  .dd.open .dd-menu{display:block}
  .dd-item,.dd-head{
    display:block;width:100%;border:0;background:none;-webkit-appearance:none;appearance:none;
    font:inherit;color:var(--fg);text-align:left;cursor:pointer;padding:6px 14px;line-height:1.3;
  }
  .dd-item:hover,.dd-head:hover,.dd-item:focus-visible,.dd-head:focus-visible{background:#eceff2;outline:none}
  .dd-item.sel{font-weight:700}
  .dd-head{position:relative;font-weight:600;padding-right:32px}
  .dd-head::after{
    content:'';position:absolute;right:14px;top:50%;width:5px;height:5px;
    border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
    transform:translateY(-50%) rotate(-45deg);
  }
  .dd-group.open > .dd-head::after{transform:translateY(-70%) rotate(45deg)}
  .dd-body{display:none;margin-left:14px;border-left:2px solid var(--line)}
  .dd-group.open > .dd-body{display:block}
  .dd-body .dd-item,.dd-body .dd-head{padding-left:12px}

  .sentence-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .sentence-row .sentence{flex:1;min-width:0}
  .sentence-row .chk{flex:none;white-space:nowrap;margin-top:3px}

  .mobile-break{
  display:inline;
}

  @media (min-width:641px){
  .sentence-row{
    justify-content:flex-start;
    gap:0;
  }

  .sentence-row .sentence{
    flex:0 1 auto;
  }

  .sentence-row .chk{
    border-left:1px solid #d0d0d0;
    padding-left:12px;
    margin-left:12px;
  }
}
  
    @media (max-width:700px){
    .content-grid{grid-template-columns:1fr}
  }
  
  @media (max-width:640px){
    .sentence-row{flex-direction:column;gap:6px}
    .sentence-row .chk{margin-top:0;font-size:13px}
    .sentence{font-size:14px}
    .chartbox{height:280px;margin-top:8px}
    .stats{font-size:12px}
    .note,.source{font-size:11px}
    input[type=text]{min-width:0;flex:1}
    .dd-menu{max-height:240px}
    .dd-item,.dd-head{padding-top:7px;padding-bottom:7px}

  .mobile-break::before{
    content:"";
    display:block;
  }
    
  }
</style>
</head>
<body>
<div class="wrap">
<div class="content-grid">

<div class="main-panel">
  <div class="controls">
    <div class="sentence-row">
    <div class="sentence">
      Show
      <select id="party" class="inline-select" aria-label="Party"></select>
      <select id="metric" class="inline-select" aria-label="Measure"></select>,
    <select id="period" class="inline-select" aria-label="Election or period"></select>
    <span class="mobile-break">against</span>
    <select id="xvar" class="inline-select" aria-label="X axis variable"></select>
    </div>
    <label class="chk" id="popLabel"><input type="checkbox" id="scalePop"> Scale to population</label>
    <label class="chk" id="winLabel"><input type="checkbox" id="colourWin"> Colour by winning party</label>
    </div>
  </div>

  <div class="chartbox"><canvas id="chart"></canvas></div>
  <div class="stats" id="stats"></div>
<div class="note" id="note"></div>
<div class="source" id="source"></div>
</div>

</div>
</div>

<script>
  
/* ============================================================
   CONFIG
   ============================================================ */
const PARTIES = {
  LAB:{name:'Labour',            colour:'#E4003B', xbounds:{'2024':[0,100], '2026':[0,100], ME:[0,100]}},
  CON:{name:'Conservative',      colour:'#0087DC', xbounds:{'2024':[0,100], '2026':[0,100], ME:[0,100]}},
  RFM:{name:'Reform UK',         colour:'#34d8ef', xbounds:{'2024':[0,100], '2026':[0,100], ME:[0,100]}},
  LDM:{name:'Lib Dem',           colour:'#FAA61A', xbounds:{'2024':[0,100], '2026':[0,100], ME:[0,100]}},
  GRN:{name:'Green',             colour:'#6ab023', xbounds:{'2024':[0,100], '2026':[0,100], ME:[0,100]}},
  RES:{name:'Restore',           colour:'#000055', elections:['ME']}
};

const EXTRA_WIN = {SNP:'#e0c800', PLC:'#005B54', OTH:'#999999', LOC:'#8e5bb5', IND:'#777777', WPB:'#7a1f1f'};
const winColour = k => (PARTIES[k] && PARTIES[k].colour) || EXTRA_WIN[k] || '#999999';
const YEAR_LABEL = {2024:'LE2024', 2026:'LE2026', ME:'mayoral election'};

/* Period options for each metric.  a = later column set, b = baseline (swing only) */
const ELECTIONS = [
  {id:'2024', label:'LE2024'},
  {id:'2026', label:'LE2026'},
  {id:'ME', label:'mayoral election'}
];
const PERIODS = {
  share: ELECTIONS.map(e=>({id:e.id, label:e.label, a:e.id})),
  swing: [{id:'2024_2026', label:'LE2024 → LE2026', a:'2026', b:'2024'}]
};

/* X-axis variables. d = key in DATA.x, fmt = tick/tooltip formatter */
const fmtInt = v => Math.round(v).toLocaleString('en-GB');
const XVARS = [
  {id:'prox', label:'Distance from centre (km)',          axis:'Distance from city centre (km)',            fmt:v=>fmtInt(v)+' km', tick:v=>fmtInt(v), min:0, max:35},
  {id:'density', label:'Population Density',              axis:'Population per square km',                    fmt:v=>fmtInt(v), tick:v=>fmtInt(v), min:0, max:20000},
  {id:'depriv',   label:'Household Deprivation',            axis:'Households deprived in 1-4 dimensions',     fmt:v=>v.toFixed(1)+'%', tick:v=>v, min:0, max:100},
  {id:'a1524', label:'Aged 15–24 (%)',                      axis:'Population aged 15–24 (%)',              fmt:v=>v.toFixed(1)+'%', tick:v=>v+'%', min:0, max:100},
  {id:'a2539', label:'Aged 25–39 (%)',                    axis:'Population aged 25–39 (%)',             fmt:v=>v.toFixed(1)+'%', tick:v=>v+'%', min:0, max:100},
  {id:'a4064', label:'Aged 40–64 (%)',                    axis:'Population aged 40–64 (%)',              fmt:v=>v.toFixed(1)+'%', tick:v=>v+'%', min:0, max:100},
  {id:'a65',   label:'Aged 65+ (%)',                      axis:'Population aged 65+ (%)',               fmt:v=>v.toFixed(1)+'%', tick:v=>v+'%', min:0, max:100},
  {id:'white',   label:'White (%)',                       axis:'White (%)',                              fmt:v=>v.toFixed(1)+'%', tick:v=>v+'%', min:0, max:100},
  {id:'black',   label:'Black (%)',                       axis:'Black, African or Caribbean (%)',         fmt:v=>v.toFixed(1)+'%', tick:v=>v+'%', min:0, max:100},
  {id:'asian',   label:'Asian (%)',                       axis:'Asian (%)',                                 fmt:v=>v.toFixed(1)+'%', tick:v=>v+'%', min:0, max:100},
  {id:'mixed',   label:'Mixed (%)',                       axis:'Mixed or multiple ethnic groups (%)',          fmt:v=>v.toFixed(1)+'%', tick:v=>v+'%', min:0, max:100},
  {id:'christian',   label:'Christian (%)',                axis:'Population identifying as Christian (%)',               fmt:v=>v.toFixed(1)+'%', tick:v=>v+'%', min:0, max:100},
  {id:'muslim',   label:'Muslim (%)',                axis:'Population identifying as Muslim (%)',               fmt:v=>v.toFixed(1)+'%', tick:v=>v+'%', min:0, max:100},

  {id:'noqual',  label:'No qualifications (%)',           axis:'16+ Population with no qualifications (%)',     fmt:v=>v.toFixed(1)+'%', tick:v=>v+'%', min:0, max:100},
  {id:'highqual',  label:'Higher education (%)',          axis:'16+ Population with higher education qualifications (%)',     fmt:v=>v.toFixed(1)+'%', tick:v=>v+'%', min:0, max:100},
];

  /* ============================================================
   X-AXIS NESTS
   Add, rename or reorganise dropdown nests here.
   Each attribute is identified by its XVARS id.
   ============================================================ */

const XVAR_NESTS = [
  {
    name: 'Age',
    attributes: ['a1524', 'a2539', 'a4064', 'a65']
  },

      {
    name: 'Ethnicity',
    attributes: ['white', 'black', 'asian', 'mixed']
  },
  
    {
    name: 'Education',
    attributes: ['noqual', 'highqual']
  },
  
  {
    name: 'Economy',
    attributes: ['depriv']
  },
  
    {
    name: 'Religion',
    attributes: ['christian', 'muslim', 'noreligion']
  },

    {
    name: 'Geography',
    attributes: ['density', 'prox']

];

  /* ============================================================
   DATA TABLE  →  NAMES / DATA
   Reads the pasted table in <script id="geo-data"> (tab-separated, first row = headers)
     Constituency | PARTY_period columns (e.g. LAB_2024, CON_proj) | one column per X variable
   Blank or 0 in a party column = "didn't stand".  Blank in an X column = no data for that seat.
   ============================================================ */
const NAMES = [], DATA = {x:{}, win:{}};
(function parseTable(){
  const lines = document.getElementById('geo-data').textContent
    .replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim()!=='');
  const head = lines[0].split('\t').map(h=>h.trim());
  const rows = lines.slice(1).map(l=>l.split('\t'));
  rows.forEach(r=>NAMES.push((r[0]||'').trim()));
  head.forEach((h,c)=>{
    if(c===0 || h==='') return;
    if(h.toLowerCase()==='borough'){ DATA.borough = rows.map(r=>String(r[c]||'').trim()); return; }
    const w = h.match(/^(\d{4}|ME)_winner$/i);
    if(w){ DATA.win[w[1].toUpperCase()] = rows.map(r=>String(r[c]||'').trim().toUpperCase()); return; }
    const m = h.match(/^([A-Za-z]+)_(.+)$/);
    const isParty = m && PARTIES[m[1].toUpperCase()];
    const col = rows.map(r=>{
      const v = parseFloat(String(r[c]||'').replace(/[,%\s]/g,''));
      return isNaN(v) ? (isParty ? 0 : null) : v;
    });
    if(isParty){ const p=m[1].toUpperCase(); (DATA[m[2]] = DATA[m[2]] || {})[p] = col; }
    else DATA.x[h] = col;
  });
  const missing = [];
Object.keys(PARTIES).forEach(p=>(PARTIES[p].elections || ELECTIONS.map(e=>e.id)).forEach(id=>{
  if(!(DATA[id] && DATA[id][p])) missing.push(p+'_'+id);
}));
  XVARS.forEach(x=>{ if(!DATA.x[x.id]) missing.push(x.id); });
  if(!DATA.borough) missing.push('borough');
  if(!DATA.x.population) missing.push('population');
  ELECTIONS.forEach(e=>{ if(!DATA.win[e.id]) missing.push(e.id+'_winner'); });
  if(missing.length){
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="padding:10px;color:#b00020;font-weight:600">Data table is missing column(s): '+missing.join(', ')+'</div>');
    throw new Error('Missing columns: '+missing.join(', '));
  }
})();
  
/* ============================================================
   STATE + DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const state = {party:'LAB', metric:'share', period:'2026', xvar:'depriv', trend:true, hi:-1, xparty:'LAB', xel:'2024', colourByWin:true, scalePop:false};

$('party').innerHTML  = Object.keys(PARTIES).map(k=>`<option value="${k}">${PARTIES[k].name}</option>`).join('');
function fillXVar(){
  let h = '';
  const assigned = new Set();

  // Add the manually defined attribute nests
  XVAR_NESTS.forEach(nest => {
    const attributes = nest.attributes
      .map(id => XVARS.find(x => x.id === id))
      .filter(Boolean);

    if (!attributes.length) return;

    h += `<optgroup label="${nest.name}">`;

    attributes.forEach(x => {
      h += `<option value="${x.id}">${x.label}</option>`;
      assigned.add(x.id);
    });

    h += '</optgroup>';
  });

  // Keep any attributes not assigned to a nest available
  XVARS.filter(x => !assigned.has(x.id)).forEach(x => {
    h += `<option value="${x.id}">${x.label}</option>`;
  });

  // Keep the existing party vote share section
  h += '<optgroup label="Party vote share">';

  Object.keys(PARTIES).forEach(p => {
    (PARTIES[p].elections || ELECTIONS.map(e => e.id)).forEach(id => {
      const lab = ELECTIONS.find(e => e.id === id).label;

      h += `<option value="pshare:${p}|${id}"
        data-sub="${PARTIES[p].name}"
        data-label="${PARTIES[p].name} vote share, ${lab}">${lab}</option>`;
    });
  });

  h += '</optgroup>';

  $('xvar').innerHTML = h;
}

  /* returns the X variable definition, building one on the fly for party vote share */
function getXv(){
  if(state.xvar!=='pshare') return XVARS.find(x=>x.id===state.xvar);
  const name = PARTIES[state.xparty].name;
  const lab  = ELECTIONS.find(e=>e.id===state.xel).label;
  return {
    id:'pshare',
    label: `${name} vote share (${lab})`,
    short: `${state.xparty} (${lab})`,
    axis:  `${name} vote share, ${lab==='Projected'?'projected':lab} (%)`,
    fmt: v=>v.toFixed(1)+'%',
    tick:v=>v+'%',
    min: (PARTIES[state.xparty].xbounds || {})[state.xel]?.[0],
    max: (PARTIES[state.xparty].xbounds || {})[state.xel]?.[1],
    data: DATA[state.xel][state.xparty].map(v=>v===0 ? null : v)
  };
}

function availablePeriods(metric){
  const ok = PARTIES[state.party].elections || ELECTIONS.map(e=>e.id);
  return PERIODS[metric].filter(o => ok.includes(o.a) && (!o.b || ok.includes(o.b)));
}

function fillMetrics(){
  const metrics = [['share','vote share'],['swing','swing']].filter(([m]) => availablePeriods(m).length);
  $('metric').innerHTML = metrics.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  if(!metrics.some(([v])=>v===state.metric)) state.metric = metrics[0][0];
  $('metric').value = state.metric;
}

function fillPeriods(){
  const opts = availablePeriods(state.metric);
  if(!opts.some(o=>o.id===state.period)){
    const old = [].concat(PERIODS.share, PERIODS.swing).find(o=>o.id===state.period);
    const pick = (old && (opts.find(o=>o.a===old.a) || opts.find(o=>o.b===old.a))) || opts[opts.length-1];
    state.period = pick.id;
  }
  $('period').innerHTML = opts.map(o=>`<option value="${o.id}">${o.label}</option>`).join('');
  $('period').value = state.period;
}

/* ============================================================
   MATHS
   ============================================================ */
function yValues(){
  const p = PERIODS[state.metric].find(o=>o.id===state.period);
  const A = DATA[p.a][state.party];

  if(state.metric==='share'){
    return A.map((v,i)=>v===0 ? null : v);
  }

  const B = DATA[p.b][state.party];
  return A.map((v,i)=>{
    if(v===0 || B[i]===0) return null;
    return +(v-B[i]).toFixed(3);
  });
}
function pearson(xs,ys){
  const n=xs.length; let sx=0,sy=0;
  for(let i=0;i<n;i++){sx+=xs[i];sy+=ys[i];}
  const mx=sx/n,my=sy/n; let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy;}
  const r=sxy/Math.sqrt(sxx*syy);
  return {r, slope:sxy/sxx, mx, my};
}

/* ============================================================
   CHART
   ============================================================ */

const isMobile = () => window.matchMedia('(max-width:640px)').matches;
  
const hiPlugin = {
  id:'hiLabel',
  afterDatasetsDraw(chart){
    if(state.hi<0) return;
    const m = chart.getDatasetMeta(2); if(!m.data.length) return;
    const pt = m.data[0], c = chart.ctx, a = chart.chartArea;
    const txt = NAMES[state.hi];
    c.save(); c.font='600 13px system-ui,sans-serif';
    const w = c.measureText(txt).width+12, h=22;
    let x = pt.x+10, y = pt.y-h-6;
    if(x+w>a.right) x = pt.x-10-w;
    if(y<a.top) y = pt.y+10;
    c.fillStyle='#1b1f24'; c.beginPath(); c.roundRect(x,y,w,h,5); c.fill();
    c.fillStyle='#fff'; c.textBaseline='middle'; c.fillText(txt,x+6,y+h/2+.5);
    c.restore();
  }
};

  /* ---------- custom leader-line tooltip ---------- */
const tip = {idx:-1, ds:0};

/* Chart.js calls this whenever the hovered point changes */
function tipExternal(ctx){
  const t = ctx.tooltip;
  if(t.opacity===0 || !t.dataPoints || !t.dataPoints.length){ tip.idx = -1; return; }
  tip.idx = t.dataPoints[0].dataIndex;
  tip.ds  = t.dataPoints[0].datasetIndex;
}

const tipPlugin = {
  id:'leaderTip',
  afterDraw(chart){
    if(tip.idx<0 || tip.ds!==0) return;
    const data = chart.data.datasets[0].data;
    const meta = chart.getDatasetMeta(0);
    const el = meta.data[tip.idx], raw = data[tip.idx];
    if(!el || !raw || raw.y===null || !Number.isFinite(el.x) || !Number.isFinite(el.y)) return;

    const m = isMobile(), ctx = chart.ctx, a = chart.chartArea;
    const fs = m ? 10 : 11, pad = m ? 5 : 6, lh = fs + 3;
    const xv = getXv();
const borough = DATA.borough[raw.i];
const title = borough ? `${NAMES[raw.i]} (${borough})` : NAMES[raw.i];
    const rows = [
      {label: yAxisShort(),                        value: fmtY(raw.y)},
      {label: xv.short || xv.label.replace(/ \(.*\)/,''), value: xv.fmt(raw.x)}
    ];

    /* measure the box */
    const minGap   = m ? 10 : 14;   /* minimum space between label and value */
    const titleGap = m ? 5 : 6;     /* space below the constituency name */
    const divAbove = 2;             /* space between the Y row and the divider */
    const divBelow = 5;             /* space between the divider and the X row */

    ctx.save();
    ctx.font = `700 ${fs+1}px system-ui,sans-serif`;
    let w = ctx.measureText(title).width;
    ctx.font = `400 ${fs}px system-ui,sans-serif`;
    rows.forEach(r => {
      w = Math.max(w, ctx.measureText(r.label).width + minGap + ctx.measureText(r.value).width);
    });

    /* vertical layout, relative to the top of the box */
    const yTitle = pad;
    const yRow1  = yTitle + (fs+1) + titleGap;
    const yDiv   = yRow1 + fs + divAbove;
    const yRow2  = yDiv + divBelow;
    const bw = w + pad*2, bh = yRow2 + fs + pad;

    /* pixel positions of all other visible dots */
    const pts = [];
    meta.data.forEach((p,i)=>{
      if(i===tip.idx || !data[i] || data[i].y===null) return;
      if(Number.isFinite(p.x) && Number.isFinite(p.y)) pts.push(p);
    });

    /* ---- build candidate routes ----
       Each route = start direction, optional elbow, end point, and the box
       positioned so the line meets the MIDDLE of one of its sides. */
    const S = m ? [10,18,30,44] : [14,26,42,60];     /* diagonal run (px per axis) */
    const H = m ? [8,18,30]     : [10,22,36];        /* length of the final straight segment */
    const D = m ? [18,32,50,70] : [24,44,70,100];    /* length for purely straight routes */
    const x0 = el.x, y0 = el.y, R = 0.7071;
    const cands = [];

    for(const sx of [1,-1]) for(const sy of [1,-1]) for(const s of S) for(const h of H){
      const ex = x0+sx*s, ey = y0+sy*s;                     /* elbow */
      const len = s*1.4142 + h;
      /* finish horizontally into the left/right side of the box */
      let nx = ex+sx*h, ny = ey;
      cands.push({ux:sx*R, uy:sy*R, elbow:[ex,ey], end:[nx,ny], len,
        bx: sx>0 ? nx : nx-bw, by: ny-bh/2});
      /* finish vertically into the top/bottom of the box */
      nx = ex; ny = ey+sy*h;
      cands.push({ux:sx*R, uy:sy*R, elbow:[ex,ey], end:[nx,ny], len,
        bx: nx-bw/2, by: sy>0 ? ny : ny-bh});
    }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) for(const d of D){
      const nx = x0+dx*d, ny = y0+dy*d;
      cands.push({ux:dx, uy:dy, elbow:null, end:[nx,ny], len:d,
        bx: dx>0 ? nx : dx<0 ? nx-bw : nx-bw/2,
        by: dy>0 ? ny : dy<0 ? ny-bh : ny-bh/2});
    }

    /* score: stay inside the plot, avoid other dots, prefer shorter lines */
    let best = null;
    cands.forEach((c,k)=>{
      const {bx,by} = c;
      const over = Math.max(0,a.left-bx) + Math.max(0,bx+bw-a.right)
                 + Math.max(0,a.top-by)  + Math.max(0,by+bh-a.bottom);
      let hits = 0;
      for(const p of pts){
        if(p.x>bx-8 && p.x<bx+bw+8 && p.y>by-8 && p.y<by+bh+8) hits++;
      }
      c.score = over*1000 + hits*10 + c.len*0.01 + k*0.001;
      if(!best || c.score<best.score) best = c;
    });

    /* leader line: dot -> (elbow) -> box side midpoint */
    const r = (el.options && el.options.hoverRadius || 5) + 2;
    ctx.strokeStyle = '#1b1f24';
    ctx.lineWidth = 1;
    ctx.lineJoin = 'round';
    ctx.setLineDash([3,3]);
    ctx.beginPath();
    ctx.moveTo(x0 + best.ux*r, y0 + best.uy*r);
    if(best.elbow) ctx.lineTo(best.elbow[0], best.elbow[1]);
    ctx.lineTo(best.end[0], best.end[1]);
    ctx.stroke();
    ctx.setLineDash([]);

    /* box + text */
    ctx.fillStyle = '#f8faf9';
    ctx.strokeStyle = '#1b1f24';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(best.bx, best.by, bw, bh, 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#1b1f24';
    ctx.textBaseline = 'top';

    /* title */
    ctx.textAlign = 'left';
    ctx.font = `700 ${fs+1}px system-ui,sans-serif`;
    ctx.fillText(title, best.bx+pad, best.by+yTitle);

    /* divider between the two rows */
    ctx.strokeStyle = '#c9ced4';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(best.bx+pad, Math.round(best.by+yDiv)+0.5);
    ctx.lineTo(best.bx+bw-pad, Math.round(best.by+yDiv)+0.5);
    ctx.stroke();

    /* rows: label left, value right-aligned */
    ctx.font = `400 ${fs}px system-ui,sans-serif`;
    [yRow1, yRow2].forEach((yy,i)=>{
      ctx.textAlign = 'left';
      ctx.fillText(rows[i].label, best.bx+pad, best.by+yy);
      ctx.textAlign = 'right';
      ctx.fillText(rows[i].value, best.bx+bw-pad, best.by+yy);
    });
    ctx.restore();
  }
};

    {label:'Constituencies', data:[], pointRadius:3.6, pointHoverRadius:6, pointHitRadius:6, borderWidth:.6, order:2, clip:false},
    {label:'Line of best fit', data:[], type:'line', showLine:true, pointRadius:0, borderColor:'#1b1f24', borderWidth:2, borderDash:[7,5], fill:false, tension:0, order:1, pointHitRadius:0, pointHoverRadius:0},
    {label:'Highlighted', data:[], pointRadius:8, pointBorderWidth:2.5, pointBorderColor:'#1b1f24', pointBackgroundColor:'transparent', pointHoverRadius:8, order:0}
  ]},
  options:{
    maintainAspectRatio:false,
    devicePixelRatio: Math.max(window.devicePixelRatio || 1, 3),

function fmtY(v){
  if(state.metric==='swing') return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1)+' pp';
  return v.toFixed(1)+'%';
}
function periodLabel(){ return PERIODS[state.metric].find(o=>o.id===state.period).label; }
function yAxisShort(){
  return state.party+(state.metric==='share' ? '' : ' swing')+' ('+periodLabel()+')';
}
function yAxisTitle(){
  return state.metric==='share'
    ? `${PARTIES[state.party].name} vote share, ${periodLabel()==='projected'?'projected':periodLabel()} (%)`
    : `${PARTIES[state.party].name} swing, ${periodLabel()} (percentage points)`;
}

const SOURCES = {
  y: {
    '2024':     {label:'ADD SOURCE (2024)', url:''},
    '2026':     {label:'ADD SOURCE (2026)', url:''},
    ME:         {label:'ADD SOURCE (ME)', url:''},
  },
  x: {
    density:    {label:'ADD SOURCE (density)', url:''},
    prox:       {label:'ADD SOURCE (prox)', url:''},
    depriv:     {label:'ADD SOURCE (depriv)', url:''},
    a1524:      {label:'ADD SOURCE (a1524)', url:''},
    a2539:      {label:'ADD SOURCE (a2539)', url:''},
    a4064:      {label:'ADD SOURCE (a4064)', url:''},
    a65:        {label:'ADD SOURCE (a65)', url:''},
    white:      {label:'ADD SOURCE (white)', url:''},
    black:      {label:'ADD SOURCE (black)', url:''},

};
function updateSource(){
  const p = PERIODS[state.metric].find(o=>o.id===state.period);
  const parts = [p.a, p.b].filter(Boolean).map(k=>SOURCES.y[k]).concat(state.xvar==='pshare' ? SOURCES.y[state.xel] : SOURCES.x[state.xvar]);
  const unique = [...new Map(parts.map(s=>[s.label, s])).values()];
  $('source').innerHTML = 'Source: ' + unique.map(s =>
    s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>` : s.label
  ).join('; ');
}

function update(){
  tip.idx = -1;
  const xv = getXv();
  const useLog = !!xv.log;
  const rawXs = xv.data || DATA.x[xv.id], rawYs = yValues(), col = PARTIES[state.party].colour;

/* points — exclude constituencies where the party has no valid vote-share data */
const allPts = rawXs.map((x,i)=>({x, y: x===null ? null : rawYs[i], i}));
const pts = allPts.filter(p=>p.y!==null);
const xs = pts.map(p=>p.x);
const ys = pts.map(p=>p.y);
  const ds0 = chart.data.datasets[0];
  const pObj = PERIODS[state.metric].find(o=>o.id===state.period);
  const winArr = DATA.win[pObj.a];            /* election being shown, or swung to */
  const ptCols = state.colourByWin ? allPts.map(p=>winColour(winArr[p.i])) : null;
  ds0.data = allPts;
  ds0.backgroundColor      = ptCols ? ptCols.map(c=>c+'99') : col+'99';
  ds0.borderColor          = ptCols || col;
  ds0.hoverBackgroundColor = ptCols || col;
  ds0.hoverBorderColor = '#1b1f24';
  ds0.hoverBorderWidth = 1;
  
  /* axes: titles, formatting, scale type */
  const sx = chart.options.scales.x, sy = chart.options.scales.y;
  sx.type = useLog ? 'logarithmic' : 'linear';
  sx.title.text = xv.axis + (useLog ? ' – log scale' : '');
  sx.ticks.callback = v => {
    if(useLog){ const l=Math.log10(v); if(Math.abs(l-Math.round(l))>1e-9 && ![2,5,20,50,200,500,2000].includes(v)) return ''; }
    return xv.tick(v);
  };
  /* x bounds: manual if set on the variable, otherwise data range + buffer */
  if(xs.length){
    const lo = Math.min(...xs), hi = Math.max(...xs);
    if(useLog){
      sx.min = xv.min ?? lo/1.15;
      sx.max = xv.max ?? hi*1.15;
    } else {
      const pad = (hi-lo)*0.04;
      sx.min = xv.min ?? Math.floor(lo-pad);
      sx.max = xv.max ?? Math.ceil(hi+pad);
    }
  }
  sy.title.text = yAxisTitle();
  sy.ticks.callback = v => state.metric==='swing' ? (v>0?'+':v<0?'−':'')+Math.abs(v) : v+'%';
  sy.beginAtZero = state.metric==='share';
  sy.min = state.metric==='share' ? 0 : undefined;

    /* mobile sizing */
  const m = isMobile();
const baseR = m ? 2.5 : 3.6;
const pops = DATA.x.population;
const minPop = Math.min(...pops.filter(v => v > 0));
const EXPONENT = 0.75;   // 0.5 = true area scaling; higher = more exaggerated
const radii = allPts.map(p =>
  state.scalePop && pops[p.i] > 0
    ? baseR * Math.pow(pops[p.i] / minPop, EXPONENT)
    : baseR);
ds0.pointRadius      = radii;
ds0.pointHoverRadius = radii.map(r => r + (m ? 2 : 2.4));
ds0.pointHitRadius   = m ? 8 : 6;
  chart.data.datasets[1].borderWidth = m ? 1.5 : 2;
  chart.data.datasets[1].borderDash  = m ? [5,4] : [7,5];
  chart.data.datasets[2].pointRadius      = m ? 6 : 8;
  chart.data.datasets[2].pointBorderWidth = m ? 2 : 2.5;

  const tickFont  = {size: m ? 10 : 12};
  const titleFont = {size: m ? 11 : 12, weight:'600'};
  sx.ticks.font = tickFont;   sy.ticks.font = tickFont;
  sx.title.font = titleFont;  sy.title.font = titleFont;
  sx.ticks.maxTicksLimit = m ? 6 : 9;

  /* line of best fit (fitted on log10(x) when log scale is on) */
  const tr = chart.data.datasets[1];
  let statsHtml = '';
  if(state.trend){
    const tx = useLog ? xs.map(Math.log10) : xs;
    const f = pearson(tx, ys);
    const lo = Math.min(...xs), hi = Math.max(...xs), N = useLog ? 60 : 2, line = [];
    for(let k=0;k<N;k++){
      const x = useLog ? Math.pow(10, Math.log10(lo)+(Math.log10(hi)-Math.log10(lo))*k/(N-1)) : (k?hi:lo);
      const t = useLog ? Math.log10(x) : x;
      line.push({x, y:f.my + f.slope*(t-f.mx)});
    }
    tr.data = line;
    const r = f.r, strength = Math.abs(r)<.2?'very weak':Math.abs(r)<.4?'weak':Math.abs(r)<.7?'moderate':Math.abs(r)<.8?'strong':'very strong';
const correlationLabel =
  Math.abs(r) <= 0.10
    ? 'virtually no correlation'
    : `${strength} ${r>=0?'positive':'negative'}`;

statsHtml = `Correlation <b>r = ${r.toFixed(2).replace('-','−')}</b> (R² = ${(r*r).toFixed(2)}) across ${xs.length} Greater Manchester wards – ${correlationLabel}${useLog?' (on log scale)':''}.`;
  } else { tr.data = []; statsHtml = `${xs.length} Greater Manchester wards.`; }
  $('stats').innerHTML = statsHtml;

  /* highlight */
const hs = chart.data.datasets[2];
hs.data = state.hi>=0 ? [pts.find(p=>p.i===state.hi)] : [];

  /* notes */
  let note='', warn=false;
  const p = PERIODS[state.metric].find(o=>o.id===state.period);
  $('note').textContent = note; $('note').className = 'note'+(warn?' warn':'');

  chart.update();
  updateSource();
  $('party').style.borderBottomColor = col;
  ddRefreshAll();
  postHeight();
}

  /* ============================================================
   CUSTOM DROPDOWNS
   The hidden <select> stays the source of truth (options, value, onchange).
   <optgroup> = expandable group.  data-sub="Name" on an option = a second level.
   data-label on an option = text shown on the button (defaults to the option text).
   ============================================================ */
const DD = {};

function ddClose(){
  Object.values(DD).forEach(d=>{
    d.wrap.classList.remove('open');
    d.btn.setAttribute('aria-expanded','false');
  });
}

function ddTree(sel){
  const root = {kids:[], map:{}};
  Array.from(sel.options).forEach(o=>{
    const path = [];
    if(o.parentElement.tagName==='OPTGROUP') path.push(o.parentElement.label);
    if(o.dataset.sub) path.push(o.dataset.sub);
    let node = root;
    path.forEach(name=>{
      let g = node.map[name];
      if(!g){ g = {name, kids:[], map:{}}; node.map[name] = g; node.kids.push(g); }
      node = g;
    });
    node.kids.push({opt:o});
  });
  return root;
}

function ddRender(d){
  const {sel, menu} = d;
  menu.innerHTML = '';
  const build = (node, parent)=>{
    node.kids.forEach(k=>{
      if(k.opt){
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'dd-item' + (k.opt.value===sel.value ? ' sel' : '');
        b.textContent = k.opt.textContent;
        b.dataset.value = k.opt.value;
        parent.appendChild(b);
      } else {
        const g = document.createElement('div');
        g.className = 'dd-group';
        const h = document.createElement('button');
        h.type = 'button'; h.className = 'dd-head'; h.textContent = k.name;
        const body = document.createElement('div');
        body.className = 'dd-body';
        g.append(h, body);
        build(k, body);
        if(body.querySelector('.sel')) g.classList.add('open');   /* auto-expand the selected path */
        h.onclick = ()=>{
          const opening = !g.classList.contains('open');
          if(opening){
            Array.from(parent.children).forEach(s=>{
              if(s !== g && s.classList.contains('dd-group')) s.classList.remove('open');
            });
          }
          g.classList.toggle('open');
        };
        parent.appendChild(g);
      }
    });
  };
  build(ddTree(sel), menu);
}

function ddRefreshAll(){
  Object.values(DD).forEach(d=>{
    const o = d.sel.options[d.sel.selectedIndex];
    d.btn.textContent = o ? (o.dataset.label || o.textContent) : '';
    d.btn.style.borderBottomColor = d.sel.style.borderBottomColor;   /* keeps the party colour underline */
  });
}

function ddInit(ids){
  ids.forEach(id=>{
    const sel = $(id);
    const wrap = document.createElement('span');  wrap.className = 'dd';
    const btn  = document.createElement('button'); btn.type = 'button'; btn.className = 'dd-btn';
    const menu = document.createElement('div');    menu.className = 'dd-menu';
    btn.setAttribute('aria-haspopup','true');
    btn.setAttribute('aria-expanded','false');
    btn.setAttribute('aria-label', sel.getAttribute('aria-label') || id);
    wrap.append(btn, menu);
    sel.style.display = 'none';
    sel.after(wrap);
    const d = DD[id] = {sel, wrap, btn, menu};

    btn.onclick = ()=>{
      const wasOpen = wrap.classList.contains('open');
      ddClose();
      if(wasOpen) return;
      ddRender(d);
      wrap.classList.add('open');
      btn.setAttribute('aria-expanded','true');
      /* keep the menu inside the iframe's right edge */
      menu.style.left = ''; menu.style.right = '';
      if(menu.getBoundingClientRect().right > document.documentElement.clientWidth - 4){
        menu.style.left = 'auto'; menu.style.right = '0';
      }
      const s = menu.querySelector('.sel');
      if(s) menu.scrollTop = Math.max(0, s.offsetTop - menu.clientHeight/2);
    };

    menu.onclick = e=>{
      const it = e.target.closest('.dd-item');
      if(!it) return;
      sel.value = it.dataset.value;
      ddClose();
      sel.dispatchEvent(new Event('change'));   /* triggers your existing onchange handlers */
      btn.focus();
    };

    wrap.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ ddClose(); btn.focus(); return; }
      if(e.key!=='ArrowDown' && e.key!=='ArrowUp') return;
      e.preventDefault();
      if(!wrap.classList.contains('open')) btn.click();
      const items = Array.from(menu.querySelectorAll('.dd-head,.dd-item')).filter(x=>x.offsetParent);
      if(!items.length) return;
      const i = items.indexOf(document.activeElement);
      const n = e.key==='ArrowDown' ? i+1 : i-1;
      items[(n + items.length) % items.length].focus();
    });
  });
}
document.addEventListener('pointerdown', e=>{ if(!e.target.closest('.dd')) ddClose(); });

/* ============================================================
   EVENTS
   ============================================================ */
$('party').onchange  = e=>{state.party=e.target.value; fillMetrics(); fillPeriods(); update();};
$('metric').onchange = e=>{state.metric=e.target.value; fillPeriods(); update();};
$('period').onchange = e=>{state.period=e.target.value; update();};
$('xvar').onchange = e=>{
  const v = e.target.value;
  if(v.startsWith('pshare:')){
    state.xvar = 'pshare';
    [state.xparty, state.xel] = v.slice(7).split('|');
  } else {
    state.xvar = v;
  }
  update();
};

/* ============================================================
   IFRAME HEIGHT  →  parent page
   (match the message shape used by your other modules)
   ============================================================ */
function postHeight(){
  var h = Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height);
  try{ window.parent.postMessage({ sender: 'nowcast-module', height: h }, '*'); }catch(e){}
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
if('ResizeObserver' in window) new ResizeObserver(postHeight).observe(document.querySelector('.wrap'));

let wasMobile = isMobile();
window.addEventListener('resize', ()=>{
  if(isMobile() !== wasMobile){ wasMobile = isMobile(); update(); }
});
  
fillXVar();
fillMetrics();
fillPeriods();
$('party').value  = state.party;
$('metric').value = state.metric;
$('period').value = state.period;
$('xvar').value   = state.xvar;
$('colourWin').checked = state.colourByWin;
$('colourWin').onchange = e=>{ state.colourByWin = e.target.checked; update(); };
$('scalePop').checked = state.scalePop;
$('scalePop').onchange = e=>{ state.scalePop = e.target.checked; update(); };
ddInit(['party','metric','period','xvar']);
update();
</script>
